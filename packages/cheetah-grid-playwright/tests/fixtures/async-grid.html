<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>async grid fixture</title>
<link rel="stylesheet" href="../../../cheetah-grid/dist/main.css">
<script src="../../../cheetah-grid/dist/main.umd.js"></script>
</head>
<body>
<div id="parent" style="width: 600px; height: 300px;"></div>
<script>
window.grid = new cheetahGrid.ListGrid({
	parentElement: document.querySelector('#parent'),
	header: [
		{field: 'id', caption: 'ID', width: 80},
		{field: 'name', caption: 'Name', width: 200, action: 'input'},
	],
	dataSource: new cheetahGrid.data.CachedDataSource({
		get(index) {
			return new Promise((resolve) => {
				setTimeout(() => {
					resolve({id: index, name: `name${index}`});
				}, 100);
			});
		},
		length: 1000,
	}),
});
</script>
</body>
</html>
